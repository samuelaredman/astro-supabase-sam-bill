name: Checks

# Type check + unit tests on every PR and every push to main.
# Needs no secrets: neither touches Supabase.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check (astro check)
        run: npx astro check
      - name: Unit tests (vitest)
        run: npm test
