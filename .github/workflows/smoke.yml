name: Smoke tests

# Browser smoke tests against a deployed site: a Netlify deploy preview,
# a branch deploy, or production. Read-only (logged-out visitor), so they
# need no secrets. Start from the Actions tab → "Smoke tests" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to test, e.g. https://deploy-preview-123--<site>.netlify.app or https://chekpoint.gg'
        required: true
        default: 'https://chekpoint.gg'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run smoke tests
        run: npx playwright test
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
