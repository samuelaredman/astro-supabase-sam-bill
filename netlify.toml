[build]
  publish = "dist"
  command = "npm run build"

# Hosts the Netlify Image CDN is allowed to fetch and optimize. Full-match
# regex. Kept project-agnostic on purpose — never embed the concrete Supabase
# project URL here (it's the SUPABASE_DATABASE_URL env value and would trip
# Netlify's secret scanner). The middleware derives the exact host from env.
[images]
  remote_images = [
    "https://images\\.igdb\\.com/.*",
    "https://[a-z0-9]+\\.supabase\\.co/.*"
  ]

[template]
  required-extensions = ["supabase"]

# Wordmark used on every page. Netlify's default for static assets is
# must-revalidate, so each navigation does a 304 round-trip. Long-caching it
# means repeat visits reuse the cached copy immediately. The filename isn't
# content-hashed — if the artwork ever changes, bump the URL (e.g.
# chekpoint-logo-v2.webp) rather than reusing the same path.
[[headers]]
  for = "/chekpoint-logo.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
