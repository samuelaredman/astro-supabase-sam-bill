[build]
  publish = "dist"
  command = "npm run build"

# Function timeout is NOT configurable via netlify.toml — Netlify's TOML
# parser rejects `[functions] timeout = N` (must be a nested table, not a
# scalar). Set it in the Netlify UI instead: Site settings → Build & deploy
# → Functions → Function timeouts. Pro plan max is 26s.
#
# OpenXBL's POST /app/claim regularly takes >10s, so xbox-callback.ts uses
# AbortSignal.timeout(25_000); for that abort to actually fire (vs Netlify
# killing the function first) the UI setting needs to be bumped to 26s.

# Hosts the Netlify Image CDN is allowed to fetch and optimize. Full-match
# regex. Kept project-agnostic on purpose — never embed the concrete Supabase
# project URL here (it's the SUPABASE_DATABASE_URL env value and would trip
# Netlify's secret scanner). The middleware derives the exact host from env.
[images]
  remote_images = [
    "https://images\\.igdb\\.com/.*",
    "https://[a-z0-9]+\\.supabase\\.co/.*"
  ]

[template]
  required-extensions = ["supabase"]
